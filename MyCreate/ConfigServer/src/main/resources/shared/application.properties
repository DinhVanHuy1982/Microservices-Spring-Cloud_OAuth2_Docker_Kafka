logging.level.root = info

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html

#Config eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:9099/eureka/}
eureka.instance.perfect-ip-address=true


#Expose all the actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show.details=always
management.info.env.enabled=true

#zipkin
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

#Setting log
logging.file.name=myapp.log
logging.logback.rollingpolicy.max-file-size=2MB
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

#oauth 2.0 security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:9008}
#public jwt key
spring.security.oauth2.resourceserver.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:9008/oauth2/jwks}
